name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar xcodegen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild build \
            -project FocusGuardNative.xcodeproj \
            -scheme FocusGuardNative \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Empaquetar como .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/FocusGuardNative.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r FocusGuardNative.ipa Payload
          ls -la FocusGuardNative.ipa

      - name: Subir el .ipa como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuardNative-ipa
          path: FocusGuardNative.ipa
