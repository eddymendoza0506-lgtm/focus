name: FocusGuardNative
options:
  bundleIdPrefix: com.eddymendoza
  deploymentTarget:
    iOS: "16.0"

targets:
  FocusGuardNative:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: FocusGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eddymendoza.focusguardnative
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Sin firma automática: el .ipa sale SIN FIRMAR desde GitHub Actions.
        # AltServer se encarga de firmarlo con tu Apple ID al instalarlo.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
